# =====================================================================================
#  EvoSynth settings — Run-wide settings (seeds, parallel workers)
# =====================================================================================
#  One of the files in settings/ (index and rules: settings/README.md). Every *.toml file
#  in this folder is merged into one set of settings; a section may appear in one file only.
#  Each setting: what it controls / Used in: <file> → <function> / Range.
# =====================================================================================


# -------------------------------------------------------------------------------------
[run]
# -------------------------------------------------------------------------------------

# Search seed: ALL randomness of the search itself. Change it (or use --seed / --seeds) to repeat a
# run with different randomness; the same seed always reproduces the same run.
# Each component gets its own generator derived from this seed + its name
# (src/evosynth/seeding.py → stream), so components never disturb each other's random numbers.
# Used in: src/evosynth/seeding.py → stream, derive_int, seed_everything (global numpy/random/torch);
#          src/evosynth/engine/controller.py → DynamicOptimizer.__init__ (initial population,
#          injections, one generator per optimizer instance);
#          src/evosynth/optimizers/*.py → GA/PSO/DE/CMA-ES __init__ (their own generators;
#          CMA-ES samples through it instead of reseeding numpy from the clock);
#          src/evosynth/models/factory.py → build_model (every model's random_state);
#          src/evosynth/evaluators/image.py → ImageCNNEvaluator.evaluate (torch seed per configuration);
#          src/evosynth/experiments/ablation.py → run_isolated_optimizer (warm-up vectors);
#          src/evosynth/experiments/baselines.py → run_default_extratrees (model), run_random_search
#          (vectors), run_optuna_baseline (TPESampler), run_flaml_baseline (FLAML seed);
#          src/evosynth/experiments/run_context.py → run_path, RunContext (run folder name seed_<k>)
# Range: any integer >= 0
seed = 42

# Data seed: how the data is split — search subsample, CV folds, refit train/test split, NAS
# validation split. Kept fixed across seeds so every run of every method uses the same data.
# Used in: src/evosynth/evaluators/tabular.py → TabularEvaluator.__init__ (search subsample split),
#          TabularEvaluator.evaluate (StratifiedKFold shuffle);
#          src/evosynth/models/refit.py → refit_split (refit train/test split, also used by baselines);
#          src/evosynth/evaluators/image.py → ImageCNNEvaluator.__init__ (train/val split)
# Range: any integer >= 0
data_seed = 42

# Parallel evaluation threads. 0 = automatic = min(8, CPU count).
# Used in: src/evosynth/engine/controller.py → DynamicOptimizer.__init__ (default when max_workers=None),
#          DynamicOptimizer._evaluate_batch (ThreadPoolExecutor size),
#          DynamicOptimizer.run (Step 1 chunk size = 2 × workers)
# Range: 0 (auto) or 1–64
max_workers = 0
