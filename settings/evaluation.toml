# =====================================================================================
#  EvoSynth settings — How candidates are scored, feature engineering, post-search refit
# =====================================================================================
#  One of the files in settings/ (index and rules: settings/README.md). Every *.toml file
#  in this folder is merged into one set of settings; a section may appear in one file only.
#  Each setting: what it controls / Used in: <file> → <function> / Range.
# =====================================================================================


# -------------------------------------------------------------------------------------
[evaluation]
# How a candidate configuration is scored during search (tabular).
# -------------------------------------------------------------------------------------

# Cross-validation folds (StratifiedKFold, shuffled, run.data_seed).
# Used in: src/evosynth/evaluators/tabular.py → TabularEvaluator.evaluate → _cv_score   Range: 2–10
cv_folds = 2

# Early stopping for XGBoost / LightGBM, in the search AND in the refit (Phase 4.4). Off: they
# train all n_estimators rounds on the whole training fold (used by `evosynth speedup`).
# Used in: src/evosynth/evaluators/tabular.py → TabularEvaluator._fit_and_score;
#          src/evosynth/models/refit.py → refit_and_score
# Range: true / false
early_stopping = true

# Boosted models stop after this many rounds without improvement on the early-stopping set.
# Used in: src/evosynth/models/factory.py → build_model (XGBoost early_stopping_rounds),
#          fit_model (LightGBM early_stopping callback)
# Range: 5–50
early_stopping_rounds = 10

# Share of each TRAINING fold held back as the early-stopping set for XGBoost / LightGBM
# (Phase 3.3: the scoring fold is never used for early stopping). RandomForest / ExtraTrees
# train on the whole training fold.
# Used in: src/evosynth/evaluators/tabular.py → TabularEvaluator._fit_and_score;
#          src/evosynth/models/refit.py → refit_and_score (same share of the refit train rows)
# Range: 0.05–0.5
early_stopping_fraction = 0.15

# RandomForest / ExtraTrees are capped at this many trees during search (n_estimators = min(n, cap)).
# Used in: src/evosynth/models/factory.py → build_model (phase="search")      Range: ≥ 10
search_tree_cap = 150

# RF/ET depth = max_depth × multiplier, or unlimited when max_depth is at its upper bound.
# Used in: src/evosynth/models/factory.py → _bagging_depth (both search and refit phases)
# Range: ≥ 1
bagging_depth_multiplier = 3

# Score recorded for a CV fold whose model raised an exception (fraction of the metric).
# Phase 3.4: 0.0 (was 0.5), and every failure is printed and counted (TabularEvaluator.failed_folds).
# Used in: src/evosynth/evaluators/tabular.py → TabularEvaluator._cv_score (except branch)
# Range: 0–1
failed_fold_score = 0.0

# Threads per individual model during search (parallelism comes from max_workers instead).
# Used in: src/evosynth/models/factory.py → build_model (phase="search")
# Range: 1
model_n_jobs = 1

# -------------------------------------------------------------------------------------
[selection]
# Confirm before select (Phase 3.7): the search's best CV score is the maximum of many noisy
# cv_folds-fold estimates, so it is biased upwards. After the search, the top_k distinct
# configurations (by search score) are re-scored with confirm_folds-fold CV on the same search
# rows, and the best confirmed one is refitted. These extra fits are not counted in the
# evaluation budget; result.json records them under "confirmation".
# Used in: src/evosynth/experiments/selection.py → confirm_best, called from
#          src/evosynth/experiments/search.py → run_search and scaling.py → run_benchmark
# -------------------------------------------------------------------------------------
enabled = true
top_k = 5            # Range: ≥ 1
confirm_folds = 5    # Range: 2–10

# -------------------------------------------------------------------------------------
[features]
# Dataset-agnostic feature engineering (`fe_strategy` gene).
# Used in: src/evosynth/features/generic.py → GenericFeatureEngineer
# -------------------------------------------------------------------------------------

# A column counts as continuous if it has more unique values than this (in the sample below).
# Used in: GenericFeatureEngineer.fit      Range: ≥ 2
continuous_unique_threshold = 15

# Number of leading rows inspected to detect continuous columns.
# Used in: GenericFeatureEngineer.fit      Range: ≥ 100
detection_sample_rows = 2000

# 'interactions' uses the top-N continuous columns by variance (N·(N−1)/2 pairs × 2 features).
# Used in: GenericFeatureEngineer.__init__ (max_interaction_features), GenericFeatureEngineer.fit
# Range: 2–15
max_interaction_features = 6

# -------------------------------------------------------------------------------------
[refit]
# Post-search generalisation refit of the selected configuration (held-out test). The SAME refit
# is used for every tuned method (Phase 4.4): EvoSynth, Random Search and Optuna.
# Used in: src/evosynth/models/refit.py → refit_split, refit_and_score;
#          src/evosynth/models/factory.py → build_model (phase="refit"), build_default_model.
# Called by src/evosynth/experiments/search.py → run_search, scaling.py → run_benchmark ("STEP 6"),
#           baselines.py → run_random_search, run_optuna_baseline (and run_defaults: model_n_jobs).
# -------------------------------------------------------------------------------------

# Train / test rows are set per dataset (refit_train_rows, test_rows in settings/datasets.toml).

# Minimum trees in the refit model: n_estimators = max(tuned value, minimum).
min_trees_bagging = 150   # RandomForest / ExtraTrees
min_trees_lgbm    = 250   # LightGBM
min_trees_xgb     = 200   # XGBoost

# Threads per model at refit time (-1 = all cores).
model_n_jobs = -1

# -------------------------------------------------------------------------------------
[inference]
# Measured inference cost of every refitted model (Phase 4.8), stored in result.json "inference".
# Used in: src/evosynth/models/inference.py → measure, called from models/refit.py → refit_and_score
#          and experiments/baselines.py → run_defaults, run_flaml_baseline
# -------------------------------------------------------------------------------------
single_row_repeats = 200   # one-row predictions timed (median and 95th percentile reported). Range: ≥ 10
