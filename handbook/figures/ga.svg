<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 340' width='720' height='340' role='img' aria-label='GA crossover example' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>GA crossover example</title><rect width='720' height='340' rx='14' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#5b675f'/></marker></defs><text x='30.0' y='30.0' font-size='15' fill='#1f2a24' text-anchor='start' font-weight='bold'>GA arithmetic crossover (worked example from 00c §2)</text><rect x='60.0' y='50.0' width='260.0' height='260.0' rx='4' fill='#eef1ef' stroke='#cfd8d2'/><text x='60.0' y='328.0' font-size='11' fill='#5b675f' text-anchor='start' font-weight='normal'>0</text><text x='320.0' y='328.0' font-size='11' fill='#5b675f' text-anchor='end' font-weight='normal'>1</text><rect x='112.0' y='102.0' width='104.0' height='104.0' fill='#e2efe7' stroke='#2f6b4f' stroke-dasharray='4 3'/><circle cx='112.0' cy='102.0' r='7' fill='#3d73c4' stroke='none'/><text x='122.0' y='94.0' font-size='11' fill='#3d73c4' text-anchor='start' font-weight='bold'>parent 1 (0.20, 0.80)</text><circle cx='216.0' cy='206.0' r='7' fill='#3d73c4' stroke='none'/><text x='226.0' y='198.0' font-size='11' fill='#3d73c4' text-anchor='start' font-weight='bold'>parent 2 (0.60, 0.40)</text><circle cx='190.0' cy='154.0' r='7' fill='#2f6b4f' stroke='none'/><text x='200.0' y='146.0' font-size='11' fill='#2f6b4f' text-anchor='start' font-weight='bold'>child (0.50, 0.60)</text><circle cx='190.0' cy='135.8' r='7' fill='#a76d00' stroke='none'/><text x='200.0' y='127.8' font-size='11' fill='#a76d00' text-anchor='start' font-weight='bold'>after mutation (0.50, 0.67)</text><text x='360.0' y='90.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>Each child gene lies between the parents' genes:</text><text x='360.0' y='114.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='bold'>child = α·p1 + (1 − α)·p2, a fresh α per gene</text><text x='360.0' y='140.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>α = (0.25, 0.50) → child (0.50, 0.60)</text><text x='360.0' y='176.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>Mutation (probability 0.1 per gene) adds</text><text x='360.0' y='196.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>Gaussian noise σ = 0.1: here +0.07 on gene 2.</text><text x='360.0' y='232.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>The dashed box is everywhere a blend of these</text><text x='360.0' y='250.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>two parents can land.</text></svg>
