<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 318' width='720' height='318' role='img' aria-label='Decision tree example' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Decision tree example</title><rect width='720' height='318' rx='14' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#5b675f'/></marker></defs><text x='30.0' y='30.0' font-size='15' fill='#1f2a24' text-anchor='start' font-weight='bold'>A decision tree asks yes/no questions until it reaches a class</text><line x1='360.0' y1='86.0' x2='190.0' y2='142.0' stroke='#5b675f' stroke-width='1.5' marker-end='url(#a)'/><text x='281.0' y='119.0' font-size='11' fill='#5b675f' text-anchor='start' font-weight='normal'>no</text><line x1='360.0' y1='86.0' x2='530.0' y2='142.0' stroke='#5b675f' stroke-width='1.5' marker-end='url(#a)'/><text x='451.0' y='119.0' font-size='11' fill='#5b675f' text-anchor='start' font-weight='normal'>yes</text><line x1='190.0' y1='176.0' x2='100.0' y2='232.0' stroke='#5b675f' stroke-width='1.5' marker-end='url(#a)'/><text x='151.0' y='209.0' font-size='11' fill='#5b675f' text-anchor='start' font-weight='normal'>yes</text><line x1='190.0' y1='176.0' x2='280.0' y2='232.0' stroke='#5b675f' stroke-width='1.5' marker-end='url(#a)'/><text x='241.0' y='209.0' font-size='11' fill='#5b675f' text-anchor='start' font-weight='normal'>no</text><line x1='530.0' y1='176.0' x2='450.0' y2='232.0' stroke='#5b675f' stroke-width='1.5' marker-end='url(#a)'/><text x='496.0' y='209.0' font-size='11' fill='#5b675f' text-anchor='start' font-weight='normal'>no</text><line x1='530.0' y1='176.0' x2='610.0' y2='232.0' stroke='#5b675f' stroke-width='1.5' marker-end='url(#a)'/><text x='576.0' y='209.0' font-size='11' fill='#5b675f' text-anchor='start' font-weight='normal'>yes</text><rect x='268.0' y='54.0' width='184.0' height='32.0' rx='8' fill='#e1ebf8' stroke='#3d73c4'/><text x='360.0' y='75.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='normal'>elevation > 2,800 m?</text><rect x='74.0' y='144.0' width='232.0' height='32.0' rx='8' fill='#e1ebf8' stroke='#3d73c4'/><text x='190.0' y='165.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='normal'>distance to water &lt; 100 m?</text><rect x='470.0' y='144.0' width='120.0' height='32.0' rx='8' fill='#e1ebf8' stroke='#3d73c4'/><text x='530.0' y='165.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='normal'>slope > 20°?</text><rect x='68.0' y='234.0' width='64.0' height='32.0' rx='8' fill='#e2efe7' stroke='#2f6b4f'/><text x='100.0' y='255.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='bold'>Aspen</text><rect x='212.0' y='234.0' width='136.0' height='32.0' rx='8' fill='#e2efe7' stroke='#2f6b4f'/><text x='280.0' y='255.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='bold'>Lodgepole Pine</text><rect x='398.0' y='234.0' width='104.0' height='32.0' rx='8' fill='#e2efe7' stroke='#2f6b4f'/><text x='450.0' y='255.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='bold'>Spruce/Fir</text><rect x='562.0' y='234.0' width='96.0' height='32.0' rx='8' fill='#e2efe7' stroke='#2f6b4f'/><text x='610.0' y='255.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='bold'>Krummholz</text><text x='30.0' y='300.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>max_depth limits how many questions a path may ask; deeper trees fit more detail but can memorise noise.</text></svg>
