<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 318' width='720' height='318' role='img' aria-label='Bagging versus boosting' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Bagging versus boosting</title><rect width='720' height='318' rx='14' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#5b675f'/></marker></defs><text x='30.0' y='30.0' font-size='15' fill='#1f2a24' text-anchor='start' font-weight='bold'>Two ways to build a tree ensemble</text><text x='30.0' y='62.0' font-size='13' fill='#2f6b4f' text-anchor='start' font-weight='bold'>Bagging (Random Forest, ExtraTrees): independent trees on random samples, then a vote</text><rect x='60.0' y='78.0' width='90.0' height='44.0' rx='6' fill='#e2efe7' stroke='#2f6b4f'/><text x='105.0' y='105.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='normal'>tree 1</text><line x1='105.0' y1='122.0' x2='600.0' y2='150.0' stroke='#5b675f' stroke-width='1.2' marker-end='url(#a)'/><rect x='180.0' y='78.0' width='90.0' height='44.0' rx='6' fill='#e2efe7' stroke='#2f6b4f'/><text x='225.0' y='105.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='normal'>tree 2</text><line x1='225.0' y1='122.0' x2='600.0' y2='150.0' stroke='#5b675f' stroke-width='1.2' marker-end='url(#a)'/><rect x='300.0' y='78.0' width='90.0' height='44.0' rx='6' fill='#e2efe7' stroke='#2f6b4f'/><text x='345.0' y='105.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='normal'>tree 3</text><line x1='345.0' y1='122.0' x2='600.0' y2='150.0' stroke='#5b675f' stroke-width='1.2' marker-end='url(#a)'/><rect x='420.0' y='78.0' width='90.0' height='44.0' rx='6' fill='#e2efe7' stroke='#2f6b4f'/><text x='465.0' y='105.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='normal'>tree 4</text><line x1='465.0' y1='122.0' x2='600.0' y2='150.0' stroke='#5b675f' stroke-width='1.2' marker-end='url(#a)'/><rect x='560.0' y='138.0' width='120.0' height='34.0' rx='8' fill='#2f6b4f' stroke='none'/><text x='620.0' y='160.0' font-size='13' fill='#fff' text-anchor='middle' font-weight='bold'>vote</text><text x='30.0' y='210.0' font-size='13' fill='#3d73c4' text-anchor='start' font-weight='bold'>Boosting (XGBoost, LightGBM): each tree fixes the errors left by the trees before it</text><rect x='60.0' y='226.0' width='100.0' height='44.0' rx='6' fill='#e1ebf8' stroke='#3d73c4'/><text x='110.0' y='253.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='normal'>tree 1</text><line x1='160.0' y1='248.0' x2='208.0' y2='248.0' stroke='#5b675f' stroke-width='1.5' marker-end='url(#a)'/><text x='184.0' y='240.0' font-size='10' fill='#5b675f' text-anchor='middle' font-weight='normal'>errors</text><rect x='210.0' y='226.0' width='100.0' height='44.0' rx='6' fill='#e1ebf8' stroke='#3d73c4'/><text x='260.0' y='253.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='normal'>tree 2</text><line x1='310.0' y1='248.0' x2='358.0' y2='248.0' stroke='#5b675f' stroke-width='1.5' marker-end='url(#a)'/><text x='334.0' y='240.0' font-size='10' fill='#5b675f' text-anchor='middle' font-weight='normal'>errors</text><rect x='360.0' y='226.0' width='100.0' height='44.0' rx='6' fill='#e1ebf8' stroke='#3d73c4'/><text x='410.0' y='253.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='normal'>tree 3</text><line x1='460.0' y1='248.0' x2='508.0' y2='248.0' stroke='#5b675f' stroke-width='1.5' marker-end='url(#a)'/><text x='484.0' y='240.0' font-size='10' fill='#5b675f' text-anchor='middle' font-weight='normal'>errors</text><rect x='510.0' y='226.0' width='100.0' height='44.0' rx='6' fill='#e1ebf8' stroke='#3d73c4'/><text x='560.0' y='253.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='normal'>tree 4</text><text x='30.0' y='300.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>learning_rate scales each correction; early stopping ends the sequence when a held-back slice stops improving.</text></svg>
