<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 250' width='760' height='250' role='img' aria-label='Evaluation speed-up from parallel threads and early stopping' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Evaluation speed-up from parallel threads and early stopping</title><rect width='760' height='250' rx='14' fill='#ffffff'/><text x='30.0' y='32.0' font-size='15' fill='#1f2a24' text-anchor='start' font-weight='bold'>Time to evaluate 40 configurations on Covertype (12 CPU threads)</text><line x1='260.0' y1='52.0' x2='260.0' y2='186.0' stroke='#e3e8e5' stroke-width='1'/><text x='260.0' y='202.0' font-size='11' fill='#5b675f' text-anchor='middle' font-weight='normal'>0 s</text><line x1='330.4' y1='52.0' x2='330.4' y2='186.0' stroke='#e3e8e5' stroke-width='1'/><text x='330.4' y='202.0' font-size='11' fill='#5b675f' text-anchor='middle' font-weight='normal'>50 s</text><line x1='400.7' y1='52.0' x2='400.7' y2='186.0' stroke='#e3e8e5' stroke-width='1'/><text x='400.7' y='202.0' font-size='11' fill='#5b675f' text-anchor='middle' font-weight='normal'>100 s</text><line x1='471.1' y1='52.0' x2='471.1' y2='186.0' stroke='#e3e8e5' stroke-width='1'/><text x='471.1' y='202.0' font-size='11' fill='#5b675f' text-anchor='middle' font-weight='normal'>150 s</text><line x1='541.5' y1='52.0' x2='541.5' y2='186.0' stroke='#e3e8e5' stroke-width='1'/><text x='541.5' y='202.0' font-size='11' fill='#5b675f' text-anchor='middle' font-weight='normal'>200 s</text><line x1='611.9' y1='52.0' x2='611.9' y2='186.0' stroke='#e3e8e5' stroke-width='1'/><text x='611.9' y='202.0' font-size='11' fill='#5b675f' text-anchor='middle' font-weight='normal'>250 s</text><text x='248.0' y='69.0' font-size='12' fill='#1f2a24' text-anchor='end' font-weight='normal'>sequential, no early stopping</text><rect x='260.0' y='56.0' width='359.8' height='18' rx='4' fill='#7d8a83'/><text x='627.8' y='70.0' font-size='11' fill='#1f2a24' text-anchor='start' font-weight='normal'>256 s · 1.00×</text><text x='248.0' y='103.0' font-size='12' fill='#1f2a24' text-anchor='end' font-weight='normal'>sequential, early stopping</text><rect x='260.0' y='90.0' width='308.3' height='18' rx='4' fill='#7d8a83'/><text x='576.3' y='104.0' font-size='11' fill='#1f2a24' text-anchor='start' font-weight='normal'>219 s · 1.17×</text><text x='248.0' y='137.0' font-size='12' fill='#1f2a24' text-anchor='end' font-weight='normal'>parallel (12), no early stopping</text><rect x='260.0' y='124.0' width='61.5' height='18' rx='4' fill='#7d8a83'/><text x='329.5' y='138.0' font-size='11' fill='#1f2a24' text-anchor='start' font-weight='normal'>44 s · 5.85×</text><text x='248.0' y='171.0' font-size='12' fill='#1f2a24' text-anchor='end' font-weight='normal'>parallel (12), early stopping</text><rect x='260.0' y='158.0' width='59.0' height='18' rx='4' fill='#257de0'/><text x='327.0' y='172.0' font-size='11' fill='#1f2a24' text-anchor='start' font-weight='bold'>42 s · 6.10×</text><text x='30.0' y='236.0' font-size='11' fill='#5b675f' text-anchor='start' font-weight='normal'>Speed-up = sequential-without-early-stopping time ÷ condition time. Same 40 configurations in every condition.</text></svg>
