<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 360' width='720' height='360' role='img' aria-label='CMA-ES distribution adaptation' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>CMA-ES distribution adaptation</title><rect width='720' height='360' rx='14' fill='#ffffff'/><text x='30.0' y='30.0' font-size='15' fill='#1f2a24' text-anchor='start' font-weight='bold'>CMA-ES: the search distribution learns the shape of the good region</text><rect x='60.0' y='50.0' width='280.0' height='280.0' rx='4' fill='#eef1ef' stroke='#cfd8d2'/><path d='M80,310 L320,70' stroke='#e2efe7' stroke-width='38' stroke-linecap='round'/><text x='310.0' y='108.0' font-size='11' fill='#2f6b4f' text-anchor='end' font-weight='normal'>good ridge</text><ellipse cx='130.0' cy='246.0' rx='50' ry='50' transform='rotate(0 130.0 246.0)' fill='none' stroke='#7b5cc4' stroke-width='2.5' opacity='0.35'/><circle cx='130.0' cy='246.0' r='4' fill='#7b5cc4' stroke='none'/><text x='138.0' y='268.0' font-size='11' fill='#7b5cc4' text-anchor='start' font-weight='normal'>gen 1</text><ellipse cx='186.0' cy='190.0' rx='62' ry='30' transform='rotate(-45 186.0 190.0)' fill='none' stroke='#7b5cc4' stroke-width='2.5' opacity='0.55'/><circle cx='186.0' cy='190.0' r='4' fill='#7b5cc4' stroke='none'/><text x='194.0' y='212.0' font-size='11' fill='#7b5cc4' text-anchor='start' font-weight='normal'>gen 4</text><ellipse cx='250.4' cy='128.4' rx='70' ry='16' transform='rotate(-45 250.4 128.4)' fill='none' stroke='#7b5cc4' stroke-width='2.5' opacity='0.9'/><circle cx='250.4' cy='128.4' r='4' fill='#7b5cc4' stroke='none'/><text x='258.4' y='150.4' font-size='11' fill='#7b5cc4' text-anchor='start' font-weight='normal'>gen 8</text><text x='380.0' y='90.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>Each generation CMA-ES samples from a normal</text><text x='380.0' y='110.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>distribution N(m, σ²C), then:</text><text x='380.0' y='140.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>moves the mean m towards the best samples,</text><text x='380.0' y='160.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>stretches the covariance C along directions</text><text x='380.0' y='180.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>that improved, and adapts the step size σ.</text><text x='380.0' y='222.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>Here it learns that the two hyperparameters</text><text x='380.0' y='242.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>must change together (a diagonal ridge).</text></svg>
