<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 255' width='720' height='255' role='img' aria-label='Two-fold cross-validation' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Two-fold cross-validation</title><rect width='720' height='255' rx='14' fill='#ffffff'/><text x='30.0' y='32.0' font-size='15' fill='#1f2a24' text-anchor='start' font-weight='bold'>2-fold stratified cross-validation of one configuration</text><text x='30.0' y='82.0' font-size='13' fill='#5b675f' text-anchor='start' font-weight='normal'>round 1</text><rect x='110.0' y='60.0' width='220.0' height='34.0' rx='6' fill='#2f6b4f' stroke='none'/><text x='220.0' y='82.0' font-size='12' fill='#fff' text-anchor='middle' font-weight='bold'>fold 1: train</text><rect x='340.0' y='60.0' width='220.0' height='34.0' rx='6' fill='#3d73c4' stroke='none'/><text x='450.0' y='82.0' font-size='12' fill='#fff' text-anchor='middle' font-weight='bold'>fold 2: score</text><text x='580.0' y='82.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>score1</text><text x='30.0' y='152.0' font-size='13' fill='#5b675f' text-anchor='start' font-weight='normal'>round 2</text><rect x='110.0' y='130.0' width='220.0' height='34.0' rx='6' fill='#3d73c4' stroke='none'/><text x='220.0' y='152.0' font-size='12' fill='#fff' text-anchor='middle' font-weight='bold'>fold 1: score</text><rect x='340.0' y='130.0' width='220.0' height='34.0' rx='6' fill='#2f6b4f' stroke='none'/><text x='450.0' y='152.0' font-size='12' fill='#fff' text-anchor='middle' font-weight='bold'>fold 2: train</text><text x='580.0' y='152.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>score2</text><text x='30.0' y='210.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>CV score = average of score1 and score2 (each fold keeps the class proportions)</text><text x='30.0' y='236.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>Boosted models hold back 15% of the training fold for early stopping; the scored fold is never used for it.</text></svg>
