<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 245' width='720' height='245' role='img' aria-label='Dataset split into test, search and train rows' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Dataset split into test, search and train rows</title><rect width='720' height='245' rx='14' fill='#ffffff'/><text x='30.0' y='34.0' font-size='15' fill='#1f2a24' text-anchor='start' font-weight='bold'>How one dataset is divided (Covertype, 581,012 rows; data_seed fixes it)</text><rect x='30.0' y='60.0' width='125.0' height='34.0' rx='6' fill='#9aa59f' stroke='none'/><text x='36.0' y='82.0' font-size='12' fill='#ffffff' text-anchor='start' font-weight='bold'>test 20,000</text><text x='30.0' y='130.0' font-size='14' fill='#9aa59f' text-anchor='start' font-weight='normal'>■</text><text x='48.0' y='130.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'><tspan font-weight='bold'>test 20,000</tspan>: split off first · never searched · scored once</text><rect x='159.0' y='60.0' width='125.0' height='34.0' rx='6' fill='#3d73c4' stroke='none'/><text x='165.0' y='82.0' font-size='12' fill='#ffffff' text-anchor='start' font-weight='bold'>search 20,000</text><text x='30.0' y='154.0' font-size='14' fill='#3d73c4' text-anchor='start' font-weight='normal'>■</text><text x='48.0' y='154.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'><tspan font-weight='bold'>search 20,000</tspan>: cross-validation during the search</text><rect x='288.0' y='60.0' width='218.1' height='34.0' rx='6' fill='#a76d00' stroke='none'/><text x='294.0' y='82.0' font-size='12' fill='#ffffff' text-anchor='start' font-weight='bold'>train 60,000</text><text x='30.0' y='178.0' font-size='14' fill='#a76d00' text-anchor='start' font-weight='normal'>■</text><text x='48.0' y='178.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'><tspan font-weight='bold'>train 60,000</tspan>: refit of the selected configuration</text><rect x='510.1' y='60.0' width='179.9' height='34.0' rx='6' fill='#eef1ef' stroke='none'/><text x='518.1' y='82.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>rest (unused)</text><text x='30.0' y='210.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>search and train rows are drawn from what is left after the test rows, so neither ever overlaps test.</text><text x='30.0' y='228.0' font-size='11' fill='#5b675f' text-anchor='start' font-weight='normal'>(widths not to scale)</text></svg>
