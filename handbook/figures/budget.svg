<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 260' width='720' height='260' role='img' aria-label='Budget breakdown' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Budget breakdown</title><rect width='720' height='260' rx='14' fill='#ffffff'/><text x='30.0' y='30.0' font-size='15' fill='#1f2a24' text-anchor='start' font-weight='bold'>Where 500 evaluations go in `evosynth run --full` (N = 40, t1_iters = 5)</text><rect x='30.0' y='56.0' width='52.8' height='40.0' rx='3' fill='#9aa59f' stroke='none'/><text x='56.4' y='81.0' font-size='13' fill='#fff' text-anchor='middle' font-weight='bold'>40</text><rect x='82.8' y='56.0' width='105.6' height='40.0' rx='3' fill='#c0503f' stroke='none'/><text x='135.6' y='81.0' font-size='13' fill='#fff' text-anchor='middle' font-weight='bold'>80</text><rect x='188.4' y='56.0' width='501.6' height='40.0' rx='3' fill='#7b5cc4' stroke='none'/><text x='439.2' y='81.0' font-size='13' fill='#fff' text-anchor='middle' font-weight='bold'>380</text><rect x='30.0' y='120.0' width='12.0' height='12.0' rx='2' fill='#9aa59f' stroke='none'/><text x='48.0' y='131.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>initial population: 40</text><rect x='30.0' y='146.0' width='12.0' height='12.0' rx='2' fill='#c0503f' stroke='none'/><text x='48.0' y='157.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>Tier 1: 5 iterations × 16: 80</text><rect x='30.0' y='172.0' width='12.0' height='12.0' rx='2' fill='#7b5cc4' stroke='none'/><text x='48.0' y='183.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>Tier 2: about 9 iterations × 40: 380</text><text x='30.0' y='222.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>auto k: about 9 Tier 2 iterations → k = min(3, 9 // 2) = 3, so Tier 2 has 3 checkpoints.</text><text x='30.0' y='242.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>Injections and rollbacks also spend budget; confirm-before-select (5 × 5 folds) does not.</text></svg>
