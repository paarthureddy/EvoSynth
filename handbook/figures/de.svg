<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 340' width='720' height='340' role='img' aria-label='DE donor example' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>DE donor example</title><rect width='720' height='340' rx='14' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2a24'/></marker></defs><text x='30.0' y='30.0' font-size='15' fill='#1f2a24' text-anchor='start' font-weight='bold'>DE donor vector and trial (worked example from 00c §4)</text><rect x='60.0' y='50.0' width='260.0' height='260.0' rx='4' fill='#eef1ef' stroke='#cfd8d2'/><text x='60.0' y='328.0' font-size='11' fill='#5b675f' text-anchor='start' font-weight='normal'>0</text><text x='320.0' y='328.0' font-size='11' fill='#5b675f' text-anchor='end' font-weight='normal'>1</text><line x1='190.0' y1='154.0' x2='242.0' y2='180.0' stroke='#5b675f' stroke-width='2' stroke-dasharray='4 3' marker-end='url(#a)'/><text x='222.0' y='161.0' font-size='11' fill='#5b675f' text-anchor='start' font-weight='normal'>b − c</text><line x1='138.0' y1='232.0' x2='179.6' y2='252.8' stroke='#2f6b4f' stroke-width='2.5' marker-end='url(#a)'/><circle cx='138.0' cy='232.0' r='7' fill='#3d73c4' stroke='none'/><text x='148.0' y='236.0' font-size='11' fill='#3d73c4' text-anchor='start' font-weight='bold'>a (0.30, 0.30)</text><circle cx='242.0' cy='180.0' r='7' fill='#3d73c4' stroke='none'/><text x='252.0' y='184.0' font-size='11' fill='#3d73c4' text-anchor='start' font-weight='bold'>b (0.70, 0.50)</text><circle cx='190.0' cy='154.0' r='7' fill='#3d73c4' stroke='none'/><text x='200.0' y='158.0' font-size='11' fill='#3d73c4' text-anchor='start' font-weight='bold'>c (0.50, 0.60)</text><circle cx='179.6' cy='252.8' r='7' fill='#2f6b4f' stroke='none'/><text x='189.6' y='256.8' font-size='11' fill='#2f6b4f' text-anchor='start' font-weight='bold'>donor (0.46, 0.22)</text><circle cx='164.0' cy='76.0' r='7' fill='#7b5cc4' stroke='none'/><text x='174.0' y='66.0' font-size='11' fill='#7b5cc4' text-anchor='start' font-weight='bold'>target (0.40, 0.90)</text><circle cx='179.6' cy='76.0' r='7' fill='#a76d00' stroke='none'/><text x='189.6' y='98.0' font-size='11' fill='#a76d00' text-anchor='start' font-weight='bold'>trial (0.46, 0.90)</text><text x='370.0' y='90.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='bold'>donor = a + F·(b − c), F = 0.8</text><text x='370.0' y='112.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>= (0.30, 0.30) + 0.8·(0.20, −0.10) = (0.46, 0.22)</text><text x='370.0' y='150.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>Crossover (CR = 0.7): each gene from the donor</text><text x='370.0' y='170.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>or the target → trial (0.46, 0.90)</text><text x='370.0' y='208.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>One-to-one selection: the trial replaces</text><text x='370.0' y='228.0' font-size='13' fill='#1f2a24' text-anchor='start' font-weight='normal'>the target only if it scores at least as well.</text></svg>
