<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 330' width='720' height='330' role='img' aria-label='PSO velocity example' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>PSO velocity example</title><rect width='720' height='330' rx='14' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2a24'/></marker></defs><text x='30.0' y='30.0' font-size='15' fill='#1f2a24' text-anchor='start' font-weight='bold'>PSO velocity update (1-D worked example from 00c §3, drawn on a line)</text><line x1='60.0' y1='120.0' x2='660.0' y2='120.0' stroke='#cfd8d2' stroke-width='3'/><line x1='60.0' y1='114.0' x2='60.0' y2='126.0' stroke='#5b675f' stroke-width='1.5'/><text x='60.0' y='144.0' font-size='11' fill='#5b675f' text-anchor='middle' font-weight='normal'>0.00</text><line x1='210.0' y1='114.0' x2='210.0' y2='126.0' stroke='#5b675f' stroke-width='1.5'/><text x='210.0' y='144.0' font-size='11' fill='#5b675f' text-anchor='middle' font-weight='normal'>0.25</text><line x1='360.0' y1='114.0' x2='360.0' y2='126.0' stroke='#5b675f' stroke-width='1.5'/><text x='360.0' y='144.0' font-size='11' fill='#5b675f' text-anchor='middle' font-weight='normal'>0.50</text><line x1='510.0' y1='114.0' x2='510.0' y2='126.0' stroke='#5b675f' stroke-width='1.5'/><text x='510.0' y='144.0' font-size='11' fill='#5b675f' text-anchor='middle' font-weight='normal'>0.75</text><line x1='660.0' y1='114.0' x2='660.0' y2='126.0' stroke='#5b675f' stroke-width='1.5'/><text x='660.0' y='144.0' font-size='11' fill='#5b675f' text-anchor='middle' font-weight='normal'>1.00</text><circle cx='300.0' cy='120.0' r='7' fill='#1f2a24' stroke='none'/><text x='300.0' y='100.0' font-size='12' fill='#1f2a24' text-anchor='middle' font-weight='bold'>x = 0.40</text><circle cx='360.0' cy='120.0' r='7' fill='#3d73c4' stroke='none'/><text x='360.0' y='172.0' font-size='12' fill='#3d73c4' text-anchor='middle' font-weight='bold'>pbest 0.50</text><circle cx='540.0' cy='120.0' r='7' fill='#2f6b4f' stroke='none'/><text x='540.0' y='100.0' font-size='12' fill='#2f6b4f' text-anchor='middle' font-weight='bold'>gbest 0.80</text><circle cx='519.0' cy='120.0' r='7' fill='#a76d00' stroke='none'/><text x='519.0' y='172.0' font-size='12' fill='#a76d00' text-anchor='middle' font-weight='bold'>new x = 0.765</text><line x1='300.0' y1='200.0' x2='330.0' y2='200.0' stroke='#5b675f' stroke-width='3' marker-end='url(#a)'/><text x='338.0' y='204.0' font-size='12' fill='#5b675f' text-anchor='start' font-weight='normal'>inertia 0.5·0.10 = +0.050</text><line x1='330.0' y1='230.0' x2='375.0' y2='230.0' stroke='#3d73c4' stroke-width='3' marker-end='url(#a)'/><text x='383.0' y='234.0' font-size='12' fill='#3d73c4' text-anchor='start' font-weight='normal'>cognitive 1.5·0.5·(0.50 − 0.40) = +0.075</text><line x1='375.0' y1='260.0' x2='519.0' y2='260.0' stroke='#2f6b4f' stroke-width='3' marker-end='url(#a)'/><text x='527.0' y='264.0' font-size='12' fill='#2f6b4f' text-anchor='start' font-weight='normal'>social 1.5·0.4·(0.80 − 0.40) = +0.240</text><text x='60.0' y='310.0' font-size='12' fill='#1f2a24' text-anchor='start' font-weight='normal'>v = 0.05 + 0.075 + 0.24 = 0.365  →  x moves from 0.40 to 0.765, pulled mostly towards the swarm's best.</text></svg>
